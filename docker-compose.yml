name: computer-inventory

# Everything: docker compose up --build   → app on http://localhost:8080, API docs on http://localhost:5080/scalar
# Database only (for local development with dotnet run / npm run dev): docker compose up -d db

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server images are amd64-only; on Apple Silicon this runs under Rosetta.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      # Dev-only credential for a local throwaway database. Override via env var or .env if desired.
      # In production this would come from a secret store (e.g. Docker secrets / Azure Key Vault).
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Passw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=ComputerInventory;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LocalDev_Passw0rd!};TrustServerCertificate=True"
      # Demo conveniences that are off by default in Production:
      Database__MigrateOnStartup: "true"   # create/upgrade the schema and seed on start
      ApiDocs__Enabled: "true"             # OpenAPI + Scalar UI at /scalar
      Cors__AllowedOrigins__0: http://localhost:8080
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # The browser calls the API directly, through its published port.
        VITE_API_BASE_URL: http://localhost:5080/api
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mssql-data:
