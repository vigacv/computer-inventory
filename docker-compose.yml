name: computer-inventory

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server images are amd64-only; on Apple Silicon this runs under Rosetta.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      # Dev-only credential for a local throwaway database. Override via env var or .env if desired.
      # In production this would come from a secret store (e.g. Docker secrets / Azure Key Vault).
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Passw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mssql-data:
